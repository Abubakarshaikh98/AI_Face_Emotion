<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        /* =====================================================
           LOGIN THEME - sirf yahan ke rang badlo
           (dashboard ki style.css se alag hai)
        ===================================================== */
        :root {
            color-scheme: light dark;

            --page: #F5F5F4;        /* page background */
            --card: #FFFFFF;        /* login box */
            --field: #F0F0EE;       /* input background */
            --ink: #22262B;         /* main text */
            --muted: #5A646C;       /* subtitle, placeholder */
            --line: #E1E3E5;        /* borders */
            --accent: #D98A00;      /* button + focus */
            --on-accent: #1B1300;   /* button text */
            --error: #C0392B;
            --error-bg: #FADDD9;
            --radius: 6px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #121417;
                --card: #1B1F24;
                --field: #232830;
                --ink: #ECEEF0;
                --muted: #9AA3AD;
                --line: #2C323A;
                --accent: #F2B53A;
                --on-accent: #1B1300;
                --error: #FF7B72;
                --error-bg: #3D1F25;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: var(--page);
            color: var(--ink);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 32px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .login-card p {
            text-align: center;
            color: var(--muted);
            margin: 4px 0 24px;
        }

        .login-card input {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px;
            font-size: 14px;
            color: var(--ink);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        .login-card input::placeholder { color: var(--muted); }

        .login-card input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-card button:hover { opacity: 0.88; }

        .login-card button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .error {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: var(--radius);
            background: var(--error-bg);
            color: var(--error);
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <h1>Admin Login</h1>
        <p>AI Face Attendance System</p>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign in</button>

        </form>

    </main>

</body>
</html>
